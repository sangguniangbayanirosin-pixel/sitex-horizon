<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SITEX – Driver App</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { max-width: 420px; margin: 0 auto; }
  </style>
</head>
<body>
  <div style="padding:12px;min-height:100vh;">
    <header class="header glass-strong" style="padding:12px 16px;">
      <div>
        <div style="font-size:0.75rem;color:var(--text-dim);">BUS PLATE</div>
        <div style="font-size:1.3rem;font-weight:700;">BUS 7G-4821</div>
      </div>
      <span class="badge badge-on-time">● ON ROUTE</span>
    </header>

    <!-- Stats -->
    <div class="grid-2" style="grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">
      <div class="glass text-center" style="padding:12px;">
        <div style="font-size:0.7rem;color:var(--text-dim);">SPEED</div>
        <div style="font-size:1.4rem;font-weight:700;color:var(--teal);">62</div>
        <div style="font-size:0.7rem;">km/h</div>
      </div>
      <div class="glass text-center" style="padding:12px;">
        <div style="font-size:0.7rem;color:var(--text-dim);">BATTERY</div>
        <div style="font-size:1.4rem;font-weight:700;color:var(--mint);">78%</div>
      </div>
      <div class="glass text-center" style="padding:12px;">
        <div style="font-size:0.7rem;color:var(--text-dim);">GPS</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--teal);">3.2 m</div>
        <div style="font-size:0.65rem;color:var(--mint);">High Accuracy</div>
      </div>
    </div>

    <!-- Live Map -->
    <div class="glass-strong" style="padding:14px;margin-bottom:16px;">
      <div class="map-title">LIVE MAP • Updated just now</div>
      <div class="map-placeholder" style="height:200px;">
        <div style="text-align:center;">
          <div style="font-size:2.5rem;color:var(--teal);">📍</div>
          <div style="color:var(--text-dim);font-size:0.85rem;">Route 24B • City Center Terminal</div>
        </div>
      </div>
    </div>

    <!-- Big Button -->
    <div class="text-center" style="margin:30px 0;">
      <button class="btn btn-danger btn-lg" style="width:180px;height:180px;border-radius:50%;font-size:1.1rem;flex-direction:column;">
        <span style="font-size:2rem;">⏹</span>
        END TRIP
      </button>
      <div style="margin-top:10px;font-size:0.8rem;color:var(--text-dim);">Tap to finish current trip</div>
    </div>

    <!-- Bottom info -->
    <div class="glass" style="padding:14px;display:flex;justify-content:space-around;text-align:center;">
      <div>
        <div style="font-size:0.7rem;color:var(--text-dim);">ROUTE</div>
        <div style="font-weight:600;">24B</div>
      </div>
      <div>
        <div style="font-size:0.7rem;color:var(--text-dim);">ETA</div>
        <div style="font-weight:600;color:var(--teal);">14:28</div>
      </div>
      <div>
        <div style="font-size:0.7rem;color:var(--text-dim);">PASSENGERS</div>
        <div style="font-weight:600;">32</div>
      </div>
    </div>

    <div class="footer-status glass" style="margin-top:20px;">
      <div class="nav-links" style="width:100%;justify-content:space-around;">
        <a href="driver.html" class="active">Tracking</a>
        <a href="index.html">Terminal</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </div>
</body>
</html>
